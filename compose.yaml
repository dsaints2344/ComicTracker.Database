name: comictracker

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # SQL Server images are amd64-only; Apple Silicon runs them via Rosetta
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "${SQL_HOST_PORT:-1434}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrations:
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.0.0-local}
    image: comictracker-database:local
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      APP_CONNSTRING: "Server=sqlserver,1433;Database=ComicTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ENVIRONMENT: ${GRATE_ENVIRONMENT:-LOCAL}
      CREATE_DATABASE: "true"
    restart: "no"

volumes:
  sqlserver-data:
