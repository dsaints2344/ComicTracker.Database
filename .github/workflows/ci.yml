name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/comictracker-database

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion needs the full history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        run: |
          dotnet tool restore
          echo "version=$(dotnet gitversion -showvariable SemVer)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start SQL Server
        run: |
          cp .env.example .env
          docker compose up -d --wait sqlserver

      - name: Run migrations against a fresh database
        run: docker compose run --rm --build migrations
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Re-run migrations (must be a clean no-op)
        run: docker compose run --rm migrations
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: SQL Server logs
        if: failure()
        run: docker compose logs sqlserver

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.validate.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.validate.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
